name: realadvisor-image

# Build ghcr.io/realadvisor/probo from the realadvisor branch. Mirrors
# upstream's release-probod.yaml (linux/amd64 only: the server is a CX33).
# Tags: v<upstream version>-ra.<short sha>, plus :latest for branch builds.
# Deploying is probo-deploy's job: it pins a digest from here.

on:
  push:
    branches: [realadvisor]
    paths-ignore: ["contrib/realadvisor/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: realadvisor-image

env:
  IMAGE: ghcr.io/realadvisor/probo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: compute tags
        id: tags
        run: |
          version="$(cat cmd/probod/VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-ra.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/realadvisor" ]; then
            echo "latest=--tag ${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install JS dependencies
        run: |
          npm install -g npm@^12.0.2
          npm ci

      - name: build frontends
        run: |
          npm --workspace @probo/emails run build
          make relay
          for app in console compliance-portal employee-portal; do
            npm --workspace "@probo/${app}" run check
            NODE_ENV=production npm --workspace "@probo/${app}" run build
          done

      - name: generate Go code
        run: |
          go mod download
          go generate ./pkg/server/api/connect/v1
          go generate ./pkg/server/api/mcp/v1
          go generate ./pkg/server/api/console/v1
          go generate ./pkg/server/api/complianceportal/v1

      - name: build probod
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.tags.outputs.version }}-ra.${{ github.sha }}
        run: |
          BOOTSTRAP_VERSION="$(cat cmd/probod-bootstrap/VERSION)"
          mkdir -p linux/amd64
          go build -ldflags "-s -w -X 'main.version=${VERSION}' -X 'main.env=prod'" \
            -gcflags="-e" -o linux/amd64/probod ./cmd/probod/main.go
          go build -ldflags "-s -w -X 'main.version=${BOOTSTRAP_VERSION}'" \
            -gcflags="-e" -o linux/amd64/probod-bootstrap ./cmd/probod-bootstrap/main.go
          chmod +x linux/amd64/*

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        env:
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.title=probod" \
            --label "org.opencontainers.image.description=Probo, RealAdvisor fork" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "${IMAGE}:${TAG}" \
            ${{ steps.tags.outputs.latest }} \
            --push \
            .
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### Image"
            echo '`'"${IMAGE}:${TAG}@${digest}"'`'
            echo
            echo "Deploy with: \`./deploy/bump-image.sh ${TAG}\` in probo-deploy."
          } >> "$GITHUB_STEP_SUMMARY"
