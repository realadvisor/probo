# Self-contained local stack to try a RealAdvisor fork image before it is
# deployed. Nothing here talks to production. See README.md in this folder.
#
#   PROBO_IMAGE=ghcr.io/realadvisor/probo:v0.291.0-ra.abc1234 \
#     docker compose -f contrib/realadvisor/compose.test.yaml up
#
# Console http://localhost:8080, emails http://localhost:8025 (Mailpit).
# Secrets below are throwaway dev values, not used anywhere else.

services:
  probo:
    image: ${PROBO_IMAGE:-ghcr.io/realadvisor/probo:latest}
    ports:
      - "8080:8080"
    environment:
      PROBOD_BASE_URL: http://localhost:8080
      PROBOD_API_ADDR: ":8080"
      PROBOD_API_CORS_ALLOWED_ORIGINS: http://localhost:8080
      PROBOD_AUTH_COOKIE_SECURE: "false"
      PROBOD_AUTH_COOKIE_NAME: probo_test_sid

      PROBOD_ENCRYPTION_KEY: 2QJv6GSLD9YLbrsItA5e3hYLzLN5bgu18RFFCD4jNdg=
      PROBOD_AUTH_COOKIE_SECRET: this-is-a-throwaway-secret-for-cookie-signing-at-least-32-bytes
      PROBOD_AUTH_PASSWORD_PEPPER: this-is-a-throwaway-pepper-for-password-hashing-at-least-32-bytes

      PROBOD_PG_ADDR: postgres:5432
      PROBOD_PG_USERNAME: postgres
      PROBOD_PG_PASSWORD: postgres
      PROBOD_PG_DATABASE: probod

      PROBOD_TRUST_CENTER_TLS_MODE: external
      PROBOD_TRUST_CENTER_HTTP_ADDR: ":10080"
      PROBOD_TRUST_CENTER_BASE_DOMAIN: portal.localhost

      # Mailpit catches every email (account confirmation, magic links).
      PROBOD_SMTP_ADDR: mailpit:1025
      PROBOD_SMTP_TLS_REQUIRED: "false"
      PROBOD_MAILER_SENDER_NAME: Probo test
      PROBOD_MAILER_SENDER_EMAIL: no-reply@localhost

      # SeaweedFS as S3 (same setup as upstream compose.prod.yaml).
      PROBOD_AWS_REGION: us-east-1
      PROBOD_AWS_BUCKET: probod
      PROBOD_AWS_ACCESS_KEY_ID: probod
      PROBOD_AWS_SECRET_ACCESS_KEY: thisisnotasecret
      PROBOD_AWS_ENDPOINT: http://seaweedfs:8333
      PROBOD_AWS_USE_PATH_STYLE: "true"

      # probod refuses to start without an LLM provider; agent features are unused.
      PROBOD_OPENAI_API_KEY: disabled

      PROBOD_CHROME_DP_ADDR: chrome:9222
      PROBOD_TRACING_ADDR: ""
      PROBOD_METRICS_ADDR: "127.0.0.1:8081"
    volumes:
      - probo-test-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      mailpit:
        condition: service_started
      chrome:
        condition: service_started

  postgres:
    image: postgres:17
    shm_size: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: probod
      PORTAL_BASE_DOMAIN: portal.localhost
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01_probod.sh
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d probod"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:cea8339d21dad1b200adce581dd7434d254b8f5975f142c3b4c930ba78647eef
    command: >
      server -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
      -volume.max=100 -master.volumeSizeLimitMB=1024 -dir=/data
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-test-data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  chrome:
    image: chromedp/headless-shell@sha256:b24482ae166e2c67135f5a8ba9575c257efdd8e2fd6b2e931f9d88ede3d72f3b
    shm_size: 512m
    command:
      - "--headless"
      - "--disable-gpu"
      - "--disable-dev-shm-usage"
      - "--hide-scrollbars"
      - "--mute-audio"
      - "--no-default-browser-check"
      - "--no-first-run"
      - "--disable-background-networking"
      - "--disable-background-timer-throttling"
      - "--disable-extensions"

configs:
  postgres-init:
    content: |
      #!/bin/sh
      set -eu
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c \
        "ALTER DATABASE \"$$POSTGRES_DB\" SET probo.trust_center_base_domain TO '$$PORTAL_BASE_DOMAIN';"
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "probod",
            "credentials": [{ "accessKey": "probod", "secretKey": "thisisnotasecret" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging", "Lock"]
          }
        ]
      }

volumes:
  probo-test-data:
  postgres-test-data:
  seaweedfs-test-data:
